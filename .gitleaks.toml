# Gitleaks config: used by the Husky pre-commit hook and the GitHub Actions
# security scan. Extends the built-in ruleset (Anthropic, OpenAI, GCP, AWS,
# GitHub, private keys, ...) with rules for this app's own variables.
title = "ig-reels-app"

[extend]
useDefault = true

[[rules]]
id = "apify-api-token"
description = "Apify API token"
regex = '''\bapify_api_[A-Za-z0-9]{20,}\b'''
keywords = ["apify_api_"]

# The built-in Anthropic rule only matches full-length keys; this also
# catches truncated or partially pasted ones.
[[rules]]
id = "anthropic-key-any-length"
description = "Anthropic API or admin key (any length)"
regex = '''\bsk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "ai-api-key-assignment"
description = "Any provider's API key assigned to AI_API_KEY (or the legacy SAMBANOVA_API_KEY)"
regex = '''(?i)\b(?:AI|SAMBANOVA)_API_KEY["']?\s*[:=]\s*["']?([A-Za-z0-9._~+/=:-]{16,512})'''
secretGroup = 1
keywords = ["ai_api_key", "sambanova_api_key"]
